name: Build Hogwarts Launcher
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project
        run: unzip -o hogwarts-launcher.zip -d project
      - name: Build APK
        working-directory: project
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hogwarts-launcher-apk
          path: project/app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hogwarts Launcher build ${{ github.run_number }}
          files: project/app/build/outputs/apk/release/app-release.apk
